@if ((isMobile$ | async) && (isAuthenticated$ | async)) {
  <ds-user-menu [inExpandableNavbar]="true"></ds-user-menu>
}

<div class="navbar-nav flex-shrink-1 h-100 align-items-md-stretch gapx-3"
     role="menubar"
     id="main-site-navigation"
     [ngClass]="(isMobile$ | async) ? 'navbar-nav-mobile' : 'navbar-nav-desktop'">

  <!-- Seções existentes -->
  @for (section of (sections | async); track section) {
    <ng-container
      *ngComponentOutlet="(sectionMap$ | async).get(section.id)?.component; injector: (sectionMap$ | async).get(section.id)?.injector;">
    </ng-container>
  }

  <!-- Dropdown "O Deposita" -->
  <div class="nav-item dropdown"
       (mouseenter)="openDropdownDeposita()"
       (mouseleave)="closeDropdownDeposita()">
    <a class="ds-menu-item nav-link dropdown-toggle"
       href="#"
       id="o-deposita-dropdown"
       role="button"
       aria-haspopup="true"
       [attr.aria-expanded]="isDropdownDepositaOpen"
       (click)="$event.preventDefault(); isDropdownDepositaOpen = !isDropdownDepositaOpen">
      O Deposita
    </a>
    <div class="dropdown-menu"
         [ngClass]="{'show': isDropdownDepositaOpen}"
         aria-labelledby="o-deposita-dropdown">
     <a class="ds-menu-item dropdown-item" href="/info/presentation">{{'navbar.presentation' | translate}}</a>
    <a class="ds-menu-item dropdown-item" href="/info/repositorypolicy">{{'navbar.repositorypolicy' | translate}}</a>
    <a class="ds-menu-item dropdown-item" href="assets/docs/Deposita_Manual_de_depósito_de_obras_v2.pdf" target="_blank" rel="noopener">{{'navbar.depositmanual' | translate}}</a>
    </div>
  </div>

  <!-- Link simples "Contatos" -->
  <a class="ds-menu-item nav-link" href="/info/contacts" role="menuitem">
    Contatos
  </a>

</div>
